name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q PhantomAIVision.zip
      - name: More memory
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> PhantomAIVision/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx3g" >> PhantomAIVision/gradle.properties
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Build
        working-directory: PhantomAIVision
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: PhantomAIVision/app/build/outputs/apk/debug/app-debug.apk
